[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmbackupd"
version = "0.1.2"
description = "KVM/libvirt backup management daemon"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Illia Chykalov", email = "ilyamus74@gmail.com" }]
dependencies = []

[project.scripts]
vmbackupd = "vmbackupd.daemon:main"
vmbackupctl = "vmbackupd.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/ilyamus74-ctrl/vmbackupd"
Repository = "https://github.com/ilyamus74-ctrl/vmbackupd"
Issues = "https://github.com/ilyamus74-ctrl/vmbackupd/issues"
